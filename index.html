<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b3d36">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Samishka</title>
<style>
:root{--g:#0b3d36;--y:#ffb04d;--bg:#f6f2ea;--c:#fff;--t:#14211d;--m:#5f6f69;--b:#e4ddd0}
@media(prefers-color-scheme:dark){:root{--bg:#0e1512;--c:#16211c;--t:#eaf2ee;--m:#93a39b;--b:#27352e}}
*{box-sizing:border-box}
body{margin:0;padding-bottom:84px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);line-height:1.45}
select,input,textarea,button{font:inherit;color:inherit}
#hero{background:var(--g);color:#fff;padding:16px 16px 18px;border-radius:0 0 28px 28px}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:26px;font-weight:800}
.top h1 span{color:var(--y)}
#lang{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:6px}
#lang option{color:#000}
#hb h2{font-size:28px;line-height:1.15;margin:18px 0 6px}
#hb p{margin:0 0 14px;opacity:.9}
.sb{display:flex;gap:8px}
.sb input{flex:1;min-width:0;border:0;border-radius:14px;padding:13px;background:#fff;color:#14211d}
.go{background:var(--y);color:#2a1a00;border:0;border-radius:14px;padding:0 18px;font-weight:800;cursor:pointer}
.cur{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.pill{border:1px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:20px;padding:6px 14px;cursor:pointer}
.pill.on{background:var(--y);border-color:var(--y);color:#2a1a00;font-weight:700}
main{padding:14px;max-width:640px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:baseline}
.hd h3{margin:0;font-size:21px}
.hd span{color:var(--m);font-size:14px}
#chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0}
.chip{flex:none;border:1px solid var(--b);background:var(--c);border-radius:20px;padding:7px 14px;cursor:pointer}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.btn{display:block;width:100%;background:var(--g);color:#fff;border:0;border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:17px}
.price{font-weight:800;color:var(--g);font-size:19px}
@media(prefers-color-scheme:dark){.price{color:var(--y)}}
.meta{color:var(--m);font-size:14px;margin:2px 0 6px}
.tag{display:inline-block;background:var(--bg);border-radius:6px;padding:1px 8px;font-size:13px;margin-right:4px}
.row{display:flex;gap:8px;margin-top:8px;align-items:center}
.wa{background:#1fa855;color:#fff;text-decoration:none;border-radius:10px;padding:9px 14px;font-weight:600}
.del{background:none;border:1px solid var(--b);border-radius:10px;padding:8px 12px;cursor:pointer}
.fav{margin-left:auto;background:none;border:1px solid var(--b);border-radius:10px;padding:6px 12px;font-size:18px;cursor:pointer}
#empty{color:var(--m);text-align:center;padding:34px 10px;background:var(--c);border-radius:16px}
.note{background:#fff3e0;color:#6b4513;border:1px solid #f1d9b4;border-radius:14px;padding:12px;margin:14px 0;font-size:14px}
#help{background:#e6f0ec;color:#143c36;border:1px solid #cfe0d9;border-radius:14px;padding:14px;text-align:center}
#help b{display:block}
.supb{display:block;margin-top:10px;background:var(--g);color:#fff;text-decoration:none;border-radius:12px;padding:12px;font-weight:700}
.rate{text-align:center;color:var(--m);font-size:13px;margin:12px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:4px;background:var(--c);border-top:1px solid var(--b);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;border-radius:14px;padding:7px 0;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:var(--m)}
nav button b{font-size:21px;font-weight:400;line-height:1.1}
nav button.on{background:rgba(11,61,54,.13);color:var(--t);font-weight:700}
dialog{border:0;border-radius:14px;padding:16px;width:min(92vw,420px);background:var(--c);color:var(--t)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 10px;font-size:19px}
dialog input,dialog select,dialog textarea{display:block;width:100%;margin:0 0 8px;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--bg)}
dialog .two{display:flex;gap:8px}
dialog .two>*{flex:1}
.acts{display:flex;gap:8px;margin-top:4px}
.acts button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--b);background:var(--bg);cursor:pointer}
.acts .p{background:var(--g);border-color:var(--g);color:#fff;font-weight:700}
#msg{color:var(--g);font-size:14px;min-height:18px;margin-top:6px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--y);outline-offset:2px}
</style>
</head>
<body>
<div id="hero">
  <div class="top">
    <h1>Sami<span>shka</span></h1>
    <select id="lang" aria-label="Lang">
      <option value="ht">Kreyòl</option><option value="fr">Français</option>
      <option value="en">English</option><option value="es">Español</option>
    </select>
  </div>
  <div id="hb">
    <h2 data-i="tag"></h2>
    <p data-i="sub"></p>
    <div class="sb"><input id="q" data-p="search" enterkeyhint="search"><button class="go" id="qBtn" data-i="go"></button></div>
    <div class="cur"><span data-i="priceIn"></span><button class="pill on" id="cG">G</button><button class="pill" id="cD">$</button></div>
  </div>
</div>
<main>
  <div class="hd"><h3 id="vt"></h3><span id="cnt"></span></div>
  <div id="chips"></div>
  <div id="list"></div>
  <div id="misc">
    <div class="note" data-i="safe"></div>
    <div id="help"><b data-i="helpT"></b><span data-i="helpD"></span><a class="supb" id="sup" target="_blank" rel="noopener" data-i="support"></a></div>
    <p class="rate" id="rate"></p>
  </div>
</main>
<nav>
  <button id="nHome"><b>⌂</b><span data-i="home"></span></button>
  <button id="nFavs"><b>♡</b><span data-i="favs"></span></button>
  <button id="nPub"><b>+</b><span data-i="pub"></span></button>
  <button id="nMe"><b>☺</b><span data-i="me"></span></button>
</nav>

<dialog id="authD">
  <h2 data-i="login"></h2>
  <input id="em" type="email" autocomplete="email" data-p="email">
  <input id="pw" type="password" autocomplete="current-password" data-p="pass">
  <div class="acts">
    <button class="p" id="loginGo" data-i="login"></button>
    <button id="signGo" data-i="signup"></button>
  </div>
  <div class="acts"><button id="authX" data-i="cancel"></button></div>
  <div id="msg"></div>
</dialog>

<dialog id="sellD">
  <h2 data-i="sell"></h2>
  <input id="fT" data-p="title" maxlength="80">
  <div class="two"><input id="fP" type="number" min="0" inputmode="numeric" data-p="price">
    <select id="fC"><option>HTG</option><option>USD</option></select></div>
  <div class="two"><select id="fCat"></select><select id="fTy"></select></div>
  <input id="fCi" data-p="city" maxlength="40">
  <input id="fPh" type="tel" inputmode="tel" data-p="phone">
  <textarea id="fD" rows="3" data-p="desc" maxlength="500"></textarea>
  <div class="acts">
    <button class="p" id="pubGo" data-i="publish"></button>
    <button id="sellX" data-i="cancel"></button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB = supabase.createClient(
  'https://rpbczuhgjvlugtbvtqzt.supabase.co',
  'sb_publishable_7ABLiTUNz0KnRXSUNJsaNA_4xqxpcN-'
);
const RATE = 131, SUPPORT = '';
const CATS = ['house','land','clothes','beauty','tech','other'];
const EM = {house:'🏠',land:'🌴',clothes:'👕',beauty:'💄',tech:'🎧',other:'✨'};
const T = {
ht:{all:'Tout',login:'Konekte',signup:'Kreye kont',logout:'Dekonekte',email:'Imèl',pass:'Modpas (6 karaktè oswa plis)',sell:'Pibliye yon anons',title:'Tit anons lan',price:'Pri',desc:'Deskripsyon',city:'Vil',phone:'WhatsApp (ex: 50937000000)',publish:'Pibliye',cancel:'Anile',none:'Poko gen anons. Se ou ki premye!',del:'Efase',sale:'Vant',rent:'Lokasyon',confirm:'Tcheke imèl ou pou konfime kont lan.',need:'Konekte anvan ou kontinye.',done:'Anons pibliye!',err:'Gen yon pwoblèm, eseye ankò.',ask:'Konfime efase anons lan?',
 tag:'Sa w ap chèche a, pre oswa lwen.',sub:'Dekouvri pwodwi vandè an Ayiti ap pwopoze.',search:'Ex: telefòn, soulye…',go:'Chèche',priceIn:'Pri yo an :',disc:'Pou dekouvri',ads:'Anons',safe:'Toujou verifye pwodwi a, vandè a ak kondisyon peman anvan ou achte. Rankontre nan yon kote ki an sekirite.',helpT:'Bezwen èd?',helpD:'Yon kesyon, yon pwoblèm oswa yon lide? Ekri nou sou WhatsApp.',support:'Sipò · WhatsApp',rate:'Konvèsyon apwoksimatif',home:'Akèy',favs:'Favori',pub:'Pibliye',me:'Mwen',favNone:'Poko gen favori.',
 cat:{house:'Kay',land:'Teren',clothes:'Rad',beauty:'Bote',tech:'Elektwonik',other:'Lòt'}},
fr:{all:'Tout',login:'Se connecter',signup:'Créer un compte',logout:'Déconnexion',email:'E-mail',pass:'Mot de passe (6 caractères ou plus)',sell:'Publier une annonce',title:'Titre de l’annonce',price:'Prix',desc:'Description',city:'Ville',phone:'WhatsApp (ex : 50937000000)',publish:'Publier',cancel:'Annuler',none:'Aucune annonce pour l’instant. Soyez le premier !',del:'Supprimer',sale:'Vente',rent:'Location',confirm:'Vérifiez votre e-mail pour confirmer le compte.',need:'Connectez-vous pour continuer.',done:'Annonce publiée !',err:'Un problème est survenu, réessayez.',ask:'Supprimer cette annonce ?',
 tag:'Ce que tu cherches, près ou loin.',sub:'Découvre des produits proposés par des vendeurs en Haïti.',search:'Ex : téléphone, chaussures…',go:'Chercher',priceIn:'Prix affichés en :',disc:'À découvrir',ads:'Annonces',safe:'Vérifie toujours le produit, le vendeur et les conditions de paiement avant tout achat. Rencontre-toi dans un lieu sûr.',helpT:'Besoin d’aide ?',helpD:'Une question, un problème ou une idée ? Écris-nous sur WhatsApp.',support:'Sipò · Support WhatsApp',rate:'Conversion approximative',home:'Accueil',favs:'Favoris',pub:'Publier',me:'Moi',favNone:'Aucun favori pour l’instant.',
 cat:{house:'Maison',land:'Terrain',clothes:'Vêtements',beauty:'Beauté',tech:'Électronique',other:'Autre'}},
en:{all:'All',login:'Log in',signup:'Create account',logout:'Log out',email:'Email',pass:'Password (6+ characters)',sell:'Post a listing',title:'Listing title',price:'Price',desc:'Description',city:'City',phone:'WhatsApp (e.g. 50937000000)',publish:'Publish',cancel:'Cancel',none:'No listings yet. Be the first!',del:'Delete',sale:'For sale',rent:'For rent',confirm:'Check your email to confirm your account.',need:'Log in to continue.',done:'Listing published!',err:'Something went wrong, try again.',ask:'Delete this listing?',
 tag:'What you’re looking for, near or far.',sub:'Discover products from sellers in Haiti.',search:'E.g. phone, shoes…',go:'Search',priceIn:'Prices shown in:',disc:'Discover',ads:'Listings',safe:'Always check the product, the seller and the payment terms before buying. Meet in a safe place.',helpT:'Need help?',helpD:'A question, a problem or an idea? Write to us on WhatsApp.',support:'Support · WhatsApp',rate:'Approximate conversion',home:'Home',favs:'Favorites',pub:'Post',me:'Me',favNone:'No favorites yet.',
 cat:{house:'House',land:'Land',clothes:'Clothes',beauty:'Beauty',tech:'Electronics',other:'Other'}},
es:{all:'Todo',login:'Iniciar sesión',signup:'Crear cuenta',logout:'Cerrar sesión',email:'Correo',pass:'Contraseña (6 caracteres o más)',sell:'Publicar un anuncio',title:'Título del anuncio',price:'Precio',desc:'Descripción',city:'Ciudad',phone:'WhatsApp (ej: 50937000000)',publish:'Publicar',cancel:'Cancelar',none:'Aún no hay anuncios. ¡Sé el primero!',del:'Eliminar',sale:'Venta',rent:'Alquiler',confirm:'Revisa tu correo para confirmar la cuenta.',need:'Inicia sesión para continuar.',done:'¡Anuncio publicado!',err:'Algo salió mal, inténtalo de nuevo.',ask:'¿Eliminar este anuncio?',
 tag:'Lo que buscas, cerca o lejos.',sub:'Descubre productos de vendedores en Haití.',search:'Ej: teléfono, zapatos…',go:'Buscar',priceIn:'Precios en:',disc:'Descubre',ads:'Anuncios',safe:'Verifica siempre el producto, al vendedor y las condiciones de pago antes de comprar. Reúnete en un lugar seguro.',helpT:'¿Necesitas ayuda?',helpD:'¿Una pregunta, un problema o una idea? Escríbenos por WhatsApp.',support:'Soporte · WhatsApp',rate:'Conversión aproximada',home:'Inicio',favs:'Favoritos',pub:'Publicar',me:'Yo',favNone:'Aún no hay favoritos.',
 cat:{house:'Casa',land:'Terreno',clothes:'Ropa',beauty:'Belleza',tech:'Electrónica',other:'Otro'}}
};
const $ = id => document.getElementById(id);
let lang = 'ht', user = null, cat = 'all', rows = [], view = 'home', disp = 'HTG', q = '', favs = new Set();
try { lang = localStorage.getItem('samishka_lang') || 'ht'; } catch (e) {}
if (!T[lang]) lang = 'ht';
const t = k => T[lang][k] ?? T.ht[k];
const cn = c => T[lang].cat[c] ?? T.ht.cat[c];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function ui() {
  document.documentElement.lang = lang;
  $('lang').value = lang;
  document.querySelectorAll('[data-i]').forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll('[data-p]').forEach(e => e.placeholder = t(e.dataset.p));
  $('chips').innerHTML = ['all', ...CATS].map(c =>
    `<button class="chip${c === cat ? ' on' : ''}" onclick="setCat('${c}')">${c === 'all' ? '✨ ' + t('all') : EM[c] + ' ' + cn(c)}</button>`).join('');
  const keep = $('fCat').value;
  $('fCat').innerHTML = CATS.map(c => `<option value="${c}">${cn(c)}</option>`).join('');
  if (keep) $('fCat').value = keep;
  const kt = $('fTy').value;
  $('fTy').innerHTML = `<option value="vente">${t('sale')}</option><option value="location">${t('rent')}</option>`;
  if (kt) $('fTy').value = kt;
  $('rate').textContent = `${t('rate')} · 1 $ = ${RATE} G`;
  $('sup').href = 'https://wa.me/' + SUPPORT;
  $('help').style.display = SUPPORT ? '' : 'none';
  render();
}
function setCat(c) { cat = c; ui(); }
function setView(v) { view = v; window.scrollTo(0, 0); render(); }

function money(r) {
  if (r.price == null) return '';
  let v = Number(r.price);
  if (r.currency !== disp) v = disp === 'USD' ? v / RATE : v * RATE;
  v = Math.round(v);
  return disp === 'USD' ? '$' + v.toLocaleString() : v.toLocaleString() + ' G';
}
function card(r) {
  const ph = String(r.phone || '').replace(/\D/g, '');
  return `<div class="card">
    <h3>${esc(r.title)}</h3>
    <div class="price">${money(r)}</div>
    <div class="meta"><span class="tag">${esc(cn(r.category))}</span><span class="tag">${r.type === 'location' ? t('rent') : t('sale')}</span>${esc(r.city)}</div>
    <div>${esc(r.description)}</div>
    <div class="row">
      ${ph ? `<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${ph}">WhatsApp</a>` : ''}
      ${user && r.user_id === user.id ? `<button class="del" onclick="del('${r.id}')">${t('del')}</button>` : ''}
      <button class="fav" aria-label="Favori" onclick="tog('${r.id}')">${favs.has(r.id) ? '♥' : '♡'}</button>
    </div></div>`;
}
function render() {
  const home = view === 'home';
  $('hb').style.display = home ? '' : 'none';
  $('chips').style.display = home ? '' : 'none';
  $('misc').style.display = home ? '' : 'none';
  $('vt').textContent = home ? t('disc') : view === 'favs' ? t('favs') : t('me');
  [['nHome','home'],['nFavs','favs'],['nMe','me']].forEach(([id, v]) => $(id).classList.toggle('on', v === view));
  let list;
  if (view === 'favs') list = rows.filter(r => favs.has(r.id));
  else if (view === 'me') list = user ? rows.filter(r => r.user_id === user.id) : [];
  else list = rows.filter(r => (cat === 'all' || r.category === cat) &&
    (!q || (r.title + ' ' + (r.description || '') + ' ' + (r.city || '')).toLowerCase().includes(q)));
  $('cnt').textContent = `${t('ads')} : ${list.length}`;
  let h = '';
  if (view === 'me') h = user
    ? `<div class="card"><b>${esc(user.email)}</b><div class="row"><button class="del" onclick="out()">${t('logout')}</button></div></div>`
    : `<div class="card"><p>${t('need')}</p><button class="btn" onclick="openAuth()">${t('login')}</button></div>`;
  if (list.length) h += list.map(card).join('');
  else if (view !== 'me' || user) h += `<div id="empty">${view === 'favs' ? t('favNone') : t('none')}</div>`;
  $('list').innerHTML = h;
}

async function load() {
  const { data, error } = await SB.from('listings').select('*').order('created_at', { ascending: false }).limit(100);
  if (error) { $('list').innerHTML = `<div id="empty">${t('err')}</div>`; return; }
  rows = data; render();
}
async function loadFavs() {
  favs = new Set();
  if (user) { const { data } = await SB.from('favorites').select('listing_id'); (data || []).forEach(f => favs.add(f.listing_id)); }
}
async function tog(id) {
  if (!user) { openAuth(); return; }
  if (favs.has(id)) { favs.delete(id); render(); await SB.from('favorites').delete().eq('listing_id', id); }
  else { favs.add(id); render(); await SB.from('favorites').insert({ listing_id: id }); }
}
async function del(id) {
  if (!confirm(t('ask'))) return;
  const { error } = await SB.from('listings').delete().eq('id', id);
  if (error) alert(t('err')); else load();
}
function openAuth() { $('msg').textContent = ''; $('authD').showModal(); }
function openSell() { if (!user) { openAuth(); $('msg').textContent = t('need'); } else $('sellD').showModal(); }
function out() { SB.auth.signOut(); }
async function auth(mode) {
  const email = $('em').value.trim(), password = $('pw').value;
  $('msg').textContent = '';
  const r = mode === 'up' ? await SB.auth.signUp({ email, password }) : await SB.auth.signInWithPassword({ email, password });
  if (r.error) { $('msg').textContent = r.error.message; return; }
  if (mode === 'up' && !r.data.session) { $('msg').textContent = t('confirm'); return; }
  $('authD').close();
}

$('lang').onchange = e => { lang = e.target.value; try { localStorage.setItem('samishka_lang', lang); } catch (x) {} ui(); };
$('qBtn').onclick = () => { q = $('q').value.trim().toLowerCase(); render(); };
$('q').onkeydown = e => { if (e.key === 'Enter') $('qBtn').click(); };
$('cG').onclick = () => { disp = 'HTG'; $('cG').classList.add('on'); $('cD').classList.remove('on'); render(); };
$('cD').onclick = () => { disp = 'USD'; $('cD').classList.add('on'); $('cG').classList.remove('on'); render(); };
$('nHome').onclick = () => setView('home');
$('nFavs').onclick = () => setView('favs');
$('nMe').onclick = () => setView('me');
$('nPub').onclick = openSell;
$('authX').onclick = () => $('authD').close();
$('loginGo').onclick = () => auth('in');
$('signGo').onclick = () => auth('up');
$('sellX').onclick = () => $('sellD').close();
$('pubGo').onclick = async () => {
  const title = $('fT').value.trim();
  if (!title) { $('fT').focus(); return; }
  const { error } = await SB.from('listings').insert({
    title, description: $('fD').value.trim(), price: $('fP').value ? Number($('fP').value) : null,
    currency: $('fC').value, category: $('fCat').value, type: $('fTy').value,
    city: $('fCi').value.trim(), phone: $('fPh').value.trim()
  });
  if (error) { alert(t('err')); return; }
  ['fT','fP','fCi','fPh','fD'].forEach(i => $(i).value = '');
  $('sellD').close(); alert(t('done')); setView('home'); load();
};
SB.auth.onAuthStateChange((_e, s) => {
  user = s ? s.user : null;
  setTimeout(async () => { await loadFavs(); render(); }, 0);
});
SB.auth.getSession().then(async ({ data }) => { user = data.session ? data.session.user : null; await loadFavs(); ui(); load(); });
ui();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
